[package]
name = "icaro-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "image", "canvas", "advanced", "svg", "tokio", "lazy"] }
image = { version = "0.24.9", default-features = false, features = ["png"] }
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
embed-resource = "3"
image = { version = "0.24.9", default-features = false, features = ["webp", "png"] }

[dev-dependencies]
icaro-core = { path = "../core" }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json.workspace = true
serde.workspace = true
