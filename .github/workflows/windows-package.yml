name: Empaquetar Windows
on:
  workflow_dispatch:
  push:
    branches: ['main', 'v*']
    tags: ['v*']
  create:
permissions:
  contents: write
concurrency:
  group: icaro-windows-publication
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'v'))
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ICARO_COMPILACION: ${{ github.run_id }}
      ICARO_REF: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ICARO_REF }}
      - name: Comprobar rama o tag de versión
        if: startsWith(env.ICARO_REF, 'v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer la versión de Cargo' }
          $version = ($metadata.packages | Where-Object name -EQ 'icaro-ui').version
          if ($env:ICARO_REF -match '^v(\d+)\.(\d+)\.x$') {
            $linea = "$($Matches[1]).$($Matches[2])."
            if (-not $version.StartsWith($linea)) { throw 'La rama de mantenimiento no coincide con la versión de Cargo' }
          } elseif ($env:ICARO_REF -ne "v$version") {
            throw 'La rama o tag no coincide con la versión de Cargo'
          }
      - name: Reutilizar una publicación idéntica
        id: publicacion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          'repetida=false' >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { exit 0 }
          $previous = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
          if ($LASTEXITCODE -ne 0) { exit 0 }
          $previous = $previous | ConvertFrom-Json
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"$').Matches.Groups[1].Value
          if ($previous.tag_name -notmatch ('^v' + [regex]::Escape($version) + '-build\.\d+$')) { exit 0 }
          $assets = @($previous.assets.name)
          if ('latest.json' -notin $assets -or "icaro-$version-windows-x86_64.exe" -notin $assets -or "icaro-$version-windows-x86_64-setup.exe" -notin $assets) { exit 0 }
          $previousTree = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($previous.tag_name)" --jq '.commit.tree.sha'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo comprobar la revisión publicada' }
          if ($previousTree.Trim() -eq (git rev-parse 'HEAD^{tree}').Trim()) {
            'repetida=true' >> $env:GITHUB_OUTPUT
            Write-Output 'El mismo contenido ya pasó las comprobaciones y tiene su actualización publicada.'
          }
      - name: Verificar núcleo e interfaz
        if: steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        run: |
          cargo test --locked -j1 -p icaro-core --lib --test actualizacion_local
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas del núcleo' }
          cargo test --locked -j1 -p icaro-ui --lib --example launcher -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas de la interfaz' }
      - name: Preparar Inno Setup firmado
        if: steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Pyrsys B.V.*') { throw 'Firma del compilador inválida' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="' + $compiler + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'No se pudo preparar Inno Setup' }
      - name: Compilar y empaquetar
        if: steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        run: ./scripts/empaquetar_windows.ps1 -Compilador (Join-Path $env:RUNNER_TEMP 'inno-6.7.3/ISCC.exe')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.publicacion.outputs.repetida != 'true'
        with:
          name: icaro-windows-x86_64
          path: target/dist/windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar actualización verificada
        if: github.event_name != 'workflow_dispatch' && steps.publicacion.outputs.repetida != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = Get-Content target/dist/windows/icaro-*-artefactos.json -Raw | ConvertFrom-Json
          $version = $metadata.version
          $tag = "v$version-build.$env:ICARO_COMPILACION"
          $notesFile = "docs/releases/$version.md"
          $notesData = Get-Content "docs/releases/$version.json" -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $notesFile) -or $notesData.version -ne $version -or $notesData.notas.Count -lt 1 -or $notesData.notas.Count -gt 200) { throw 'Faltan notas de versión válidas' }
          foreach ($note in $notesData.notas) {
            if ($note.tipo -notin @('nuevo','mejora','correccion') -or -not $note.texto -or $note.texto.Length -gt 4096) { throw 'Nota de versión inválida' }
          }
          $portable = Get-ChildItem target/dist/windows -Filter '*.exe' | Where-Object Name -NotLike '*-setup.exe' | Select-Object -First 1
          $setup = Get-ChildItem target/dist/windows -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $portable -or -not $setup) { throw 'Faltan artefactos de actualización' }
          $manifest = @{
            version = $version
            compilacion = [long]$env:ICARO_COMPILACION
            notas = @($notesData.notas)
            plataformas = @{
              'windows-x86_64' = @{archivo=$portable.Name;sha256=(Get-FileHash -LiteralPath $portable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
              'windows-x86_64-setup' = @{archivo=$setup.Name;sha256=(Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content target/dist/windows/latest.json -Encoding utf8
          $files = @(Get-ChildItem target/dist/windows -File | ForEach-Object FullName)
          $revision = (git rev-parse HEAD).Trim()
          $latest = 'true'
          $previous = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $previous = $previous | ConvertFrom-Json
            if ($previous.tag_name -match '^v(\d+\.\d+\.\d+)(?:-build\.\d+)?$') {
              $previousVersion = [version]$Matches[1]
              if ($previousVersion -gt [version]$version) { $latest = 'false' }
              if ($previousVersion -eq [version]$version) {
                $previousTree = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($previous.tag_name)" --jq '.commit.tree.sha'
                if ($LASTEXITCODE -ne 0) { throw 'No se pudo comprobar la revisión ya publicada' }
                $currentTree = (git rev-parse 'HEAD^{tree}').Trim()
                if ($previousTree.Trim() -eq $currentTree) {
                  Write-Output 'Este contenido ya está publicado; se conservan su versión y compilación.'
                  exit 0
                }
              }
            }
          }
          gh release create $tag @files --target $revision --title "Icaro Launcher $version" --notes-file $notesFile "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la actualización' }
